<title>Private</title>
<style>
  :root{--o:#F66025}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#090909;color:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
       background:radial-gradient(1200px 600px at 80% -10%,rgba(255,92,42,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,132,210,.12),transparent 60%),#090909}
  .card{width:100%;max-width:400px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:34px 28px;backdrop-filter:blur(8px)}
  .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#FF84D2,#FFA49D 45%,#FF5C2A);margin-bottom:22px}
  h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0 0 6px}
  p{margin:0 0 24px;color:#a9a9a9;font-size:14px;line-height:1.5}
  input[type=password],input[type=text]{width:100%;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#121212;color:#fff;outline:none}
  input:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(246,96,37,.25)}
  label.rm{display:flex;gap:10px;align-items:center;margin:16px 0 22px;color:#bdbdbd;font-size:14px;user-select:none}
  label.rm input{accent-color:var(--o);width:18px;height:18px}
  button{width:100%;font-size:16px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--o);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{min-height:20px;margin-top:14px;font-size:13px;color:#ff8a65}
  .show{background:none;border:0;color:#8a8a8a;font-size:12px;padding:6px 0 0;width:auto;font-weight:500}
</style></head>
<body>
<main class="card">
  <div class="dot"></div>
  <h1>Command Center</h1>
  <p>Private. Enter your passphrase to unlock this device.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="jon" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="passphrase" required>
    <button type="button" class="show" id="show">Show</button>
    <label class="rm"><input id="rm" type="checkbox" checked> Remember this device</label>
    <button id="go" type="submit">Unlock</button>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), msg = t => $('msg').textContent = t;
  const params = new URLSearchParams(location.search);
  const next = (params.get('next') || '').replace(/^\/+/, '').replace(/\.\.+/g, '');
  const enc = new TextEncoder();
  function idb() { return new Promise((res, rej) => { const r = indexedDB.open('cc-vault', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function op(mode, fn) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('k', mode);
    const q = fn(tx.objectStore('k')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
  const normalize = p => p.trim().toLowerCase().split(/[\s\-]+/).filter(Boolean).join('-');
  async function manifestOk(key) {
    const r = await fetch('vault/manifest.bin', { cache: 'no-store' }); const b = new Uint8Array(await r.arrayBuffer());
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12), additionalData: enc.encode('manifest') }, key, b.slice(12)); return true; }
    catch { return false; }
  }
  async function keyFromRec(rec) { if (!rec) return null; if (rec.exp && Date.now() > rec.exp) return null;
    return rec.raw ? crypto.subtle.importKey('raw', rec.raw, 'AES-GCM', false, ['decrypt']) : rec.key; }
  async function enter() {
    const reg = await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) { /* first load: let SW claim, then go */ }
    reg.active && reg.active.postMessage('reset');
    location.replace('s/' + next);
  }
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) {
    msg('This browser blocks the secure viewer (private mode?). Open in Safari/Chrome normally.'); $('go').disabled = true; return;
  }
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => msg('Viewer failed to start: ' + e.message));
  if (params.has('lock')) { op('readwrite', s => s.delete('key')).then(() => msg('Locked on this device.')); history.replaceState(null, '', location.pathname); }
  else op('readonly', s => s.get('key')).then(keyFromRec).then(async k => { if (k && await manifestOk(k)) enter(); }).catch(() => {});
  $('show').onclick = () => { const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password'; $('show').textContent = p.type === 'password' ? 'Show' : 'Hide'; };
  $('f').onsubmit = async ev => {
    ev.preventDefault(); $('go').disabled = true; msg('Unlocking…');
    try {
      const meta = await (await fetch('vault/meta.json', { cache: 'no-store' })).json();
      const salt = Uint8Array.from(atob(meta.salt), c => c.charCodeAt(0));
      const base = await crypto.subtle.importKey('raw', enc.encode(normalize($('pw').value)), 'PBKDF2', false, ['deriveKey']);
      const algo = { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: meta.iter };
      const key = await crypto.subtle.deriveKey(algo, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      if (!(await manifestOk(key))) { msg('That passphrase did not work.'); $('go').disabled = false; return; }
      const exp = $('rm').checked ? Date.now() + 400 * 864e5 : Date.now() + 12 * 36e5;
      try { await op('readwrite', s => s.put({ key, exp }, 'key')); }
      catch { // browsers that cannot store CryptoKey objects: store raw bytes instead
        const ek = await crypto.subtle.deriveKey(algo, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        const raw = await crypto.subtle.exportKey('raw', ek); await op('readwrite', s => s.put({ raw, exp }, 'key'));
      }
      await enter();
    } catch (e) { msg('Could not unlock: ' + (e && e.message || e)); $('go').disabled = false; }
  };
})();
</script>
